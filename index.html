        [14, 3, 'hiroa', -1], [14, 3, 'muri', 1], [14, 3, 'yunineko', 1],

    ];
    for (const [questionIndex, optionIndex, character, delta] of semanticScoreAdjustments) {
        const scores = questions[questionIndex].options[optionIndex].scores;
        scores[character] = (scores[character] || 0) + delta;
        if (scores[character] === 0) delete scores[character];
    }

    let currentQuestion = 0;
    let userScores = {
        yoyo: 0, kurohitsuji: 0, muri: 0, hiroa: 0, yunineko: 0,
        aisha: 0, colamoonie: 0, isowata: 0, esmea: 0, snowbao: 0, potato: 0
    };

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const qData = questions[currentQuestion];
        document.getElementById('question-text').innerText = qData.q;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        qData.options.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt.scores);
            optionsContainer.appendChild(btn);
        });

        const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';
    }

    function selectOption(scores) {
        for (let char in scores) {
            userScores[char] += scores[char];
        }

        currentQuestion++;
        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        // 平手時只在同分最高者中公平抽選，不受 userScores 宣告順序影響。
        const maxScore = Math.max(...Object.values(userScores));
        const tiedWinners = Object.keys(userScores)
            .filter(char => userScores[char] === maxScore);
        const winner = tiedWinners[Math.floor(Math.random() * tiedWinners.length)];

        const data = charDatabase[winner];
        document.getElementById('result-image').src = data.img;
        document.getElementById('char-title').innerText = data.title;
        document.getElementById('potion-tag').innerText = data.potion;
        document.getElementById('char-comment').innerText = data.comment;
        document.getElementById('good-match').innerText = data.good;
        document.getElementById('bad-match').innerText = data.bad;
    }

    function copyLink() {
        navigator.clipboard.writeText(window.location.href);
        alert('網址已複製！快分享給朋友一起測測看吧！');
    }
    function restartQuiz() {
    currentQuestion = 0;

    for (let char in userScores) {
        userScores[char] = 0;
    }

    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    document.getElementById('progress').style.width = '0%';

    showQuestion();
}
