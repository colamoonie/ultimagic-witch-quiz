<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #1a0933;
            --card-bg: #2b124c;
            --accent-color: #ffd700;
            --text-color: #f3e8ff;
            --btn-hover: #4a2080;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#3a1c68 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #d1b3ff;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #140628;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #9b51e0, var(--accent-color));
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #391763;
            color: var(--text-color);
            border: 1px solid #7b3fe4;
            padding: 14px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover {
            background: var(--btn-hover);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .result-img {
            width: 100%;
            border-radius: 12px;
            border: 2px solid var(--accent-color);
            margin-bottom: 20px;
        }

        .share-btn {
            background: var(--accent-color);
            color: #1a0933;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }

        .share-btn:hover {
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<div class="container">
    <!-- 開始畫面 -->
    <div id="start-screen">
        <h1>🔮 終焉魔法學院 🔮<br>【命定魔女入學性向測驗】</h1>

        <button class="share-btn" onclick="startQuiz()">進入學院測試 ✦</button>
    </div>

    <!-- 測驗畫面 -->
    <div id="quiz-screen" class="hidden">
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="question-text" id="question-text">題目載入中...</div>
        <div class="options-container" id="options-container"></div>
    </div>

    <!-- 結果畫面 -->
    <div id="result-screen" class="hidden">

        <img id="result-image" class="result-img" src="" alt="測驗結果圖">
        <br>
        <button class="share-btn" onclick="copyLink()">📋 複製連結分享給友達</button>
    </div>
</div>

        optionsContainer.innerHTML = '';

        qData.options.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt.scores);
            optionsContainer.appendChild(btn);
        });

        const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + '%';
    }

    function selectOption(scores) {
        for (let char in scores) {
            userScores[char] += scores[char];
        }

        currentQuestion++;
        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let winner = 'hiroa';
        let maxScore = -1;
        for (let char in userScores) {
            if (userScores[char] > maxScore) {
                maxScore = userScores[char];
                winner = char;
            }
        }

        document.getElementById('result-image').src = characterImages[winner];
    }

    function copyLink() {
        navigator.clipboard.writeText(window.location.href);
        alert('網址已複製！快分享給朋友一起測測看吧！');
    }
</script>

</body>
</html>
